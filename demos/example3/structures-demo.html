<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Studio — Structures &amp; Tile Editor</title>
<style>
:root{--bg:#0d0d10;--panel:#111115;--panel-2:#191920;--line:#2a2a38;--ink:#a0a0c0;--muted:#616174;--accent:#3ecfb2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:12px Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button,select,input{font:inherit}
button{background:#0f0f14;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover,button.active{border-color:var(--accent);color:#fff}
button.active{background:#14342f;color:var(--accent)}
label{color:var(--muted)}
input[type=range]{accent-color:var(--accent);vertical-align:middle}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 11px 'Press Start 2P',ui-monospace,monospace;color:var(--accent);letter-spacing:.03em}
.sub{color:var(--muted)}
.spacer{flex:1}
.value{color:var(--accent);display:inline-block;min-width:26px;text-align:right}
.body{display:grid;grid-template-columns:340px 1fr;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
.main{overflow:auto;padding:14px;display:grid;gap:10px;align-content:start;justify-items:start}
.box{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.box h2{font:700 9px 'Press Start 2P',ui-monospace,monospace;letter-spacing:.04em;color:var(--muted);margin:0 0 9px}
#structName{color:#fff;margin-bottom:7px}
#structTiles{display:flex;flex-wrap:wrap;gap:5px;min-height:8px}
.chip{font-size:10px;padding:4px 7px}
.chk{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--ink)}
#usedBy{color:var(--accent);margin-top:6px;font-size:11px}
#sheet{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#0d0d10;image-rendering:pixelated;cursor:pointer}
.hint{color:var(--muted);line-height:1.5;margin:0;max-width:760px}
@media(max-width:820px){body{overflow:auto}.app{height:auto}.body{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">STRUCTURES</div>
    <div class="sub" id="state"></div>
    <div class="spacer"></div>
    <button id="rotCCW">&#10226; Rotate</button>
    <button id="rotCW">Rotate &#10227;</button>
    <button id="mirror">Mirror</button>
    <label><input id="with90" type="checkbox" checked> 90&deg; versions</label>
    <label>Scale <input id="scale" type="range" min="24" max="56" value="38"></label><span class="value" id="scaleV">38</span>
  </header>
  <div class="body">
    <aside class="side">
      <section class="box">
        <h2>Structure</h2>
        <div id="structName"></div>
        <div id="structTiles"></div>
        <label class="chk"><input id="onlyUsing" type="checkbox"> Only show structures using the selected tile</label>
        <div id="usedBy"></div>
      </section>
      <div id="editor"></div>
    </aside>
    <main class="main">
      <canvas id="sheet"></canvas>
      <p class="hint">Pick a tile on the left (or click a structure, then one of its tiles) and change its colours or patterns. Every structure redraws live. Edits autosave in this browser; use <b>Export edits</b> to keep them or <b>Export set as config.js</b> to paste them back into your tile library.</p>
    </main>
  </div>
</div>

/* ── textures.js ── */

const textureCache = new Map();
const previewCache = new Map();

function hexToRgb(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgbToHex(r, g, b) {
  const c = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
  return `#${c(r)}${c(g)}${c(b)}`;
}

function shade(hex, amount) {
  const c = hexToRgb(hex);
  const f = v => amount >= 0 ? v + (255 - v) * amount : v * (1 + amount);
  return rgbToHex(f(c.r), f(c.g), f(c.b));
}

function normalizeTile(tile) {
  tile.bottom ??= shade(tile.top, -0.32);
  tile.split ??= 55;
  tile.topDither ??= { mode: 'noise', ink: 'bright', bright: 65, space: 42, thick: 32, blend: 65, blendMode: 'source-over' };
  tile.bottomDither ??= { mode: 'noise', ink: 'dark', bright: 55, space: 42, thick: 32, blend: 65, blendMode: 'source-over' };
  tile.topDither.blendMode ??= 'source-over';
  tile.bottomDither.blendMode ??= 'source-over';
  return tile;
}

function stringSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hash2(x, y, seed) {
  let n = (x * 374761393 + y * 668265263 + seed * 69069) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

function inkColor(base, s) {
  return shade(base, s.ink === 'dark' ? -(0.12 + (s.bright / 100) * 0.55) : (0.12 + (s.bright / 100) * 0.55));
}

function patternAt(x, y, s, seed) {
  if (!s || s.mode === 'solid') return false;
  const space = 1 + Math.round((s.space / 100) * 6);
  const thick = 1 + Math.round((s.thick / 100) * 3);
  const density = 0.12 + (s.bright / 100) * 0.62;
  const sx = x + (seed % 17);
  const sy = y + ((seed >> 4) % 19);
  if (s.mode === 'lines') return ((sx + sy) % space) < thick;
  if (s.mode === 'crosshatch') return ((sx + sy) % space) < thick || ((sx - sy + 1000) % space) < thick;
  if (s.mode === 'dots') return (sx % space === 0 && sy % space === 0) || (thick > 2 && sx % space === 1 && sy % space === 0);
  if (s.mode === 'noise') {
    const block = 1 + Math.round((s.space / 100) * 1.5);
    return hash2(Math.floor(x / block), Math.floor(y / block), seed) < density;
  }
  if (s.mode === 'random') {
    const block = 1 + Math.round((s.space / 100) * 3);
    return hash2(Math.floor(x / block), Math.floor(y / block), seed) < density;
  }
  if (s.mode === 'brick') {
    const bh = 2 + Math.round((100 - s.space) / 22);
    const bw = bh * 2;
    const row = Math.floor(y / bh);
    const offset = (row % 2) * Math.floor(bw / 2);
    return (y % bh === 0) || ((x + offset) % bw === 0);
  }
  if (s.mode === 'paving') {
    const block = 3 + Math.round((100 - s.space) / 18);
    return (x % block === 0) || (y % block === 0);
  }
  if (s.mode === 'checker') {
    const block = 1 + Math.round((100 - s.space) / 18);
    return (Math.floor(x / block) + Math.floor(y / block)) % 2 === 0;
  }
  if (s.mode === 'weave') {
    const block = 2 + Math.round((100 - s.space) / 20);
    const cx = Math.floor(x / block), cy = Math.floor(y / block);
    const horizontal = (cx + cy) % 2 === 0;
    return horizontal ? (y % block < thick) : (x % block < thick);
  }
  if (s.mode === 'plank') {
    const bh = 3 + Math.round((100 - s.space) / 25);
    const bw = bh * 5;
    const row = Math.floor(y / bh);
    const offset = Math.floor(hash2(row, 7, seed) * bw);
    return (y % bh === 0) || ((x + offset) % bw === 0);
  }
  if (s.mode === 'shingle') {
    const bh = 4 + Math.round((100 - s.space) / 20);
    const bw = bh + 2;
    const row = Math.floor(y / bh);
    const off = (row % 2) * Math.floor(bw / 2);
    const inRow = y % bh;
    return (inRow === bh - 1) || (inRow >= Math.floor(bh / 2) && (x + off) % bw === 0);
  }
  if (s.mode === 'stonework') {
    const bh = 5 + Math.round((100 - s.space) / 25);
    const row = Math.floor(y / bh);
    const bw = 7 + Math.floor(hash2(row, 3, seed) * 7);
    const off = Math.floor(hash2(row, 11, seed) * bw);
    return (y % bh === 0) || ((x + off) % bw === 0);
  }
  if (s.mode === 'lattice') {
    const gap = 5 + Math.round((100 - s.space) / 20);
    const edge = x < 2 || y < 2 || x >= TEXTURE_SIZE - 2 || y >= TEXTURE_SIZE - 2;
    return edge || ((x + y) % gap) < 1 || ((x - y + 1000) % gap) < 1;
  }
  return false;
}

function ditherKey(s) {
  return s ? `${s.mode},${s.ink},${s.bright},${s.space},${s.thick},${s.blend},${s.blendMode || 'source-over'}` : '';
}

function textureKey(tile, face) {
  return `${face}|${tile.id}|${tile.top}|${tile.bottom}|${tile.split}|${ditherKey(tile.topDither)}|${ditherKey(tile.bottomDither)}`;
}

function applyDither(g, tile, s, seed, y0, y1, base) {
  if (!s || s.mode === 'solid' || y1 <= y0) return;
  g.save();
  g.globalAlpha = 0.12 + (s.blend / 100) * 0.88;
  g.globalCompositeOperation = s.blendMode || 'source-over';
  g.fillStyle = inkColor(base, s);
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
    for (let x = 0; x < TEXTURE_SIZE; x++) if (patternAt(x, y, s, seed)) g.fillRect(x, y, 1, 1);
  }
  g.restore();
}

function faceTexture(tile, face) {
  normalizeTile(tile);
  const key = textureKey(tile, face);
  const cached = textureCache.get(key);
  if (cached) return cached;

  const size = TEXTURE_SIZE;
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  const split = Math.max(0, Math.min(1, (Number(tile.split) || 0) / 100));
  const seed = stringSeed(tile.id + face);

  if (face === 'top') {
    g.fillStyle = tile.top;
    g.fillRect(0, 0, size, size);
    applyDither(g, tile, tile.topDither, seed, 0, size, tile.top);
  } else {
    const left = face === 'left';
    const topColor = left ? shade(tile.top, -0.12) : shade(tile.top, 0.02);
    const bottomBase = tile.bottom || tile.top;
    const bottomColor = left ? shade(bottomBase, -0.12) : shade(bottomBase, 0.02);
    const splitY = Math.round(size * split);
    g.fillStyle = topColor;
    g.fillRect(0, 0, size, splitY);
    g.fillStyle = bottomColor;
    g.fillRect(0, splitY, size, size - splitY);
    applyDither(g, tile, tile.topDither, seed + 37, 0, splitY, topColor);
    applyDither(g, tile, tile.bottomDither, seed + 101, splitY, size, bottomColor);
  }

  textureCache.set(key, c);
  return c;
}

function drawTextureTri(g, points, texture, alpha = 1) {
  if (!texture) return;
  const [p0, p1, p2] = points;
  const size = texture.width;
  const ux = (p1[0] - p0[0]) / size;
  const uy = (p1[1] - p0[1]) / size;
  const vx = (p2[0] - p0[0]) / size;
  const vy = (p2[1] - p0[1]) / size;
  g.save();
  g.globalAlpha = alpha;
  g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.closePath(); g.clip();
  g.transform(ux, uy, vx, vy, p0[0], p0[1]);
  g.drawImage(texture, 0, 0);
  g.restore();
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.closePath(); g.stroke();
  g.restore();
}

function drawTextureQuad(g, points, texture, alpha = 1) {
  if (!texture) return;
  const [p0, p1, , p3] = points;
  const size = texture.width;
  const ux = (p1[0] - p0[0]) / size;
  const uy = (p1[1] - p0[1]) / size;
  const vx = (p3[0] - p0[0]) / size;
  const vy = (p3[1] - p0[1]) / size;

  g.save();
  g.globalAlpha = alpha;
  g.beginPath();
  g.moveTo(points[0][0], points[0][1]);
  points.slice(1).forEach(pt => g.lineTo(pt[0], pt[1]));
  g.closePath();
  g.clip();
  g.transform(ux, uy, vx, vy, p0[0], p0[1]);
  g.drawImage(texture, 0, 0);
  g.restore();

  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = 'rgba(0,0,0,.4)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(points[0][0], points[0][1]);
  points.slice(1).forEach(pt => g.lineTo(pt[0], pt[1]));
  g.closePath();
  g.stroke();
  g.restore();
}

function previewKey(tile) {
  return `${tile.top}|${tile.bottom}|${tile.split}|${ditherKey(tile.topDither)}|${ditherKey(tile.bottomDither)}`;
}

function tilePreviewURL(tile) {
  normalizeTile(tile);
  const key = previewKey(tile);
  if (previewCache.has(key)) return previewCache.get(key);

  const c = document.createElement('canvas');
  c.width = 80;
  c.height = 64;
  const g = c.getContext('2d');
  const top = [[40, 7], [70, 23], [40, 39], [10, 23]];
  const left = [[10, 23], [40, 39], [40, 57], [10, 41]];
  const right = [[40, 39], [70, 23], [70, 41], [40, 57]];
  drawTextureQuad(g, left, faceTexture(tile, 'left'));
  drawTextureQuad(g, right, faceTexture(tile, 'right'));
  drawTextureQuad(g, top, faceTexture(tile, 'top'));

  const url = c.toDataURL();
  previewCache.set(key, url);
  return url;
}

/* ── structures.js ── */
/**
 * structures.js
 *
 * Multi-face isometric structures (roofs, walls, doors, steps, wells, props…)
 * built from the Town tile set in config.js and drawn with textures.js.
 *
 * Coordinate system (matches two-d-view.js / the ramp prototype):
 *   screen x = (x - y) * S      screen y = (x + y) * 0.5 * S - z * S
 *   Visible faces point toward +x ("right"), +y ("left") and +z ("top").
 *   Every structure fits inside one 1×1 cell, 0 → 1 on x and y.
 *
 * Each structure is { id, name, group, build() } where build() returns a list
 * of primitives (box / cyl / face / line). Use rot (0-3) and mirror (swap x/y)
 * at draw time to get every orientation from one definition.
 */


/* ───────────────────────── math helpers ───────────────────────── */

const VIEW = [1, 1, 1];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const proj = ([x, y, z], S, ox, oy) => [ox + (x - y) * S, oy + (x + y) * 0.5 * S - z * S];
const projVec = ([x, y, z], S) => [(x - y) * S, (x + y) * 0.5 * S - z * S];

function tileIndex(tiles = DEFAULT_TILES) {
  const map = {};
  tiles.forEach(t => { map[t.id] = t; });
  return map;
}

/* ───────────────────────── primitive builders ───────────────────────── */

// Axis-aligned box. tile = side tile id, tT = top tile id, refTop = z that the
// side texture's first row is anchored to (keeps plaster/stone bands aligned
// across wall pieces of different heights).
const box = (x0, y0, z0, x1, y1, z1, tile, o = {}) => ({ k: 'box', x0, y0, z0, x1, y1, z1, tile, layer: 0, ...o });
const cyl = (cx, cy, z0, z1, r, tile, o = {}) => ({ k: 'cyl', cx, cy, z0, z1, r, tile, layer: 0, ...o });
// Parallelogram face: o + a*u + b*v. u runs across, v runs DOWN the texture.
const quad = (o, u, v, tile, role, n, x = {}) => ({
  k: 'face', o, u, v, poly: [o, add(o, u), add(add(o, u), v), add(o, v)], tile, role, n, layer: 0, ...x,
});
// Triangle clipped out of the parallelogram o,u,v.
const tri = (poly, o, u, v, tile, role, n, x = {}) => ({ k: 'face', o, u, v, poly, tile, role, n, layer: 0, ...x });
const line = (pts, n, color = '#49342d', w = 2) => ({ k: 'line', pts, n, color, w, layer: 2 });

/* ───────────────────────── transforms ───────────────────────── */

function tp(p, { mirror, rot }) {
  let [x, y, z] = p;
  if (mirror) [x, y] = [y, x];
  for (let i = 0; i < (rot | 0); i++) [x, y] = [1 - y, x];
  return [x, y, z];
}
function tv(v, { mirror, rot }) {
  let [x, y, z] = v;
  if (mirror) [x, y] = [y, x];
  for (let i = 0; i < (rot | 0); i++) [x, y] = [-y, x];
  return [x, y, z];
}
function transformPrim(p, o) {
  if (!o.mirror && !o.rot) return p;
  if (p.k === 'box') {
    const a = tp([p.x0, p.y0, p.z0], o), b = tp([p.x1, p.y1, p.z1], o);
    return { ...p, x0: Math.min(a[0], b[0]), x1: Math.max(a[0], b[0]), y0: Math.min(a[1], b[1]), y1: Math.max(a[1], b[1]) };
  }
  if (p.k === 'cyl') {
    const c = tp([p.cx, p.cy, 0], o);
    return { ...p, cx: c[0], cy: c[1] };
  }
  if (p.k === 'face') {
    return { ...p, o: tp(p.o, o), u: tv(p.u, o), v: tv(p.v, o), poly: p.poly.map(q => tp(q, o)), n: p.n && tv(p.n, o) };
  }
  return { ...p, pts: p.pts.map(q => tp(q, o)), n: p.n && tv(p.n, o) };
}
const mirrorList = list => list.map(p => transformPrim(p, { mirror: true, rot: 0 }));

function lift(list, dz) {
  const L = p => [p[0], p[1], p[2] + dz];
  return list.map(p => {
    if (p.k === 'box') return { ...p, z0: p.z0 + dz, z1: p.z1 + dz, refTop: (p.refTop ?? p.z1) + dz };
    if (p.k === 'cyl') return { ...p, z0: p.z0 + dz, z1: p.z1 + dz };
    if (p.k === 'face') return { ...p, o: L(p.o), poly: p.poly.map(L) };
    return { ...p, pts: p.pts.map(L) };
  });
}

/* ───────────────────────── composite builders ───────────────────────── */

// Open-topped hollow block (wells, keeps, pillars, planters).
function hollow({ h, rim, tile, floorZ, floorTop, x0 = 0, y0 = 0, x1 = 1, y1 = 1, floorTile }) {
  return [
    box(x0 + rim, y0 + rim, 0, x1 - rim, y1 - rim, floorZ, floorTile || tile, { tT: floorTop }),
    box(x0, y0, 0, x0 + rim, y1, h, tile, { tT: tile }),                         // back (low x)
    box(x0 + rim, y0, 0, x1, y0 + rim, h, tile, { tT: tile }),                   // back (low y)
    box(x1 - rim, y0 + rim, 0, x1, y1, h, tile, { tT: tile }),                   // front (high x)
    box(x0 + rim, y1 - rim, 0, x1 - rim, y1, h, tile, { tT: tile }),             // front (high y)
  ];
}

const WT = 0.2, WH = 0.9, RAIL = 0.1, DH = 0.62;

// Wall running along y at the low-x edge (visible face points +x).
// kind: plain | door | doorOpen | doorway | window
function wallY(kind = 'plain', y0 = 0, y1 = 1) {
  const L = y1 - y0, T = 'plaster-stone-wall', TR = 'timber-trim', top = WH - RAIL;
  const body = (a, b, za, zb) => box(0, a, za, WT, b, zb, T, { tT: TR, refTop: WH });
  const P = [];
  if (kind === 'plain') {
    P.push(body(y0, y1, 0, top));
  } else {
    const win = kind === 'window';
    const ya = y0 + (win ? 0.3 : 0.32) * L, yb = y0 + (win ? 0.7 : 0.68) * L;
    const sill = win ? 0.4 : 0, head = win ? 0.78 : DH;
    P.push(body(y0, ya, 0, top), body(yb, y1, 0, top), body(ya, yb, head, top));
    if (win) {
      P.push(body(ya, yb, 0, sill));
      P.push(quad([0.06, ya, head], [0, yb - ya, 0], [0, 0, -(head - sill)], 'lattice-window', 'right', [1, 0, 0], { layer: -1 }));
      P.push(box(-0.02, ya - 0.035, sill - 0.03, WT + 0.02, yb + 0.035, sill, TR, { tT: TR }));
    } else {
      P.push(quad([0.05, ya, DH], [0, yb - ya, 0], [0, 0, -DH], 'doorway-dark', 'right', [1, 0, 0], { layer: -1 }));
      if (kind === 'door') P.push(box(0.04, ya, 0, 0.11, yb, DH - 0.02, 'door-wood', { tT: 'door-wood' }));
      if (kind === 'doorOpen') P.push(box(WT, ya, 0, WT + 0.34, ya + 0.05, DH - 0.02, 'door-wood', { tT: 'door-wood' }));
    }
    P.push(box(-0.015, ya - 0.035, sill, WT + 0.015, ya, head, TR, { tT: TR }));
    P.push(box(-0.015, yb, sill, WT + 0.015, yb + 0.035, head, TR, { tT: TR }));
  }
  P.push(box(-0.02, y0, top, WT + 0.02, y1, WH, TR, { tT: TR }));               // top rail
  return P;
}

// L-shaped corner: one wall along y, one along x (made by mirroring).
const corner = (kind = 'plain', otherKind = 'plain') => [...wallY(kind, 0, 1), ...mirrorList(wallY(otherKind, WT, 1))];

function gableRoof(tile = 'roof-shingle-red', h = 0.45) {
  const ym = 0.5;
  return [
    quad([0, ym, h], [1, 0, 0], [0, -ym, -h], tile, 'top', [0, -h, ym], { shadeA: 0.14 }),   // −y slope
    quad([0, ym, h], [1, 0, 0], [0, ym, -h], tile, 'top', [0, h, ym]),                       // +y slope
    tri([[1, 0, 0], [1, 1, 0], [1, ym, h]], [1, 0, h], [0, 1, 0], [0, 0, -h], 'gable-plaster', 'right', [1, 0, 0]),
    tri([[0, 0, 0], [0, 1, 0], [0, ym, h]], [0, 0, h], [0, 1, 0], [0, 0, -h], 'gable-plaster', 'right', [-1, 0, 0]),
    line([[1, 0, 0], [1, ym, h], [1, 1, 0]], [1, 0, 0]),
    line([[0, 0, 0], [0, ym, h], [0, 1, 0]], [-1, 0, 0]),
  ];
}

function pyramidRoof(tile = 'roof-shingle-red', h = 0.75) {
  const a = [0.5, 0.5, h];
  return [
    quad([0, 0.5, h], [1, 0, 0], [0, 0.5, -h], tile, 'top', [0, h, 0.5]),
    quad([0.5, 0, h], [0, 1, 0], [0.5, 0, -h], tile, 'top', [h, 0, 0.5], { shadeA: 0.16 }),
    quad([0, 0.5, h], [1, 0, 0], [0, -0.5, -h], tile, 'top', [0, -h, 0.5], { shadeA: 0.1 }),
    quad([0.5, 0, h], [0, 1, 0], [-0.5, 0, -h], tile, 'top', [-h, 0, 0.5], { shadeA: 0.1 }),
  ].map((f, i) => {
    const polys = [
      [[0, 1, 0], [1, 1, 0], a], [[1, 0, 0], [1, 1, 0], a], [[0, 0, 0], [1, 0, 0], a], [[0, 0, 0], [0, 1, 0], a],
    ];
    return { ...f, poly: polys[i] };
  });
}

  { id: 'stool', name: 'Wood Stool', group: 'props',
    build: () => [
      cyl(0.5, 0.5, 0.26, 0.32, 0.2, 'stool-wood', { tT: 'stool-wood' }),
      ...[[0.36, 0.42], [0.6, 0.34], [0.52, 0.62]].map(([x, y]) => box(x, y, 0, x + 0.06, y + 0.06, 0.26, 'stool-wood', { tT: 'stool-wood' })),
    ] },
  { id: 'planter', name: 'Planter', group: 'props',
    build: () => hollow({ h: 0.45, rim: 0.12, tile: 'stone-well', floorZ: 0.34, floorTop: 'planter-soil', floorTile: 'stone-well' }) },
];

const getStructure = id => STRUCTURES.find(s => s.id === id);

/** Ids of every tile a structure uses (sides and tops). */
function structureTiles(structure) {
  const ids = new Set();
  structure.build().forEach(p => { if (p.tile) ids.add(p.tile); if (p.tT) ids.add(p.tT); });
  return [...ids];
}

/* ───────────────────────── 90° variants ───────────────────────── */

// Pieces that look identical when turned a quarter-turn get no separate variant.
const ROT_SYMMETRIC = new Set([
  'block-moss', 'block-light', 'block-hollow', 'floor-flagstone', 'floor-plank', 'floor-plank-worn',
  'well', 'pillar-short', 'pillar-tall', 'roof-pyramid', 'roof-pyramid-plum', 'roof-cap', 'stool', 'planter',
]);

/** A copy of a structure turned `turns` × 90° (new id "<id>-r90", name "<name> (90°)"). */
function rotatedVariant(structure, turns = 1) {
  const t = ((turns % 4) + 4) % 4;
  return {
    ...structure,
    id: `${structure.id}-r${t * 90}`,
    name: `${structure.name} (${t * 90}°)`,
    build: () => structure.build().map(p => transformPrim(p, { rot: t, mirror: false })),
  };
}

/** The 90° versions only. */
const STRUCTURES_ROT90 = STRUCTURES.filter(s => !ROT_SYMMETRIC.has(s.id)).map(s => rotatedVariant(s, 1));

/** Library with each structure followed by its 90° version (symmetric pieces appear once). */
const STRUCTURES_WITH_90 = STRUCTURES.flatMap(s => (ROT_SYMMETRIC.has(s.id) ? [s] : [s, rotatedVariant(s, 1)]));


/* ───────────────────────── rendering ───────────────────────── */

function spans(len, off) {
  const out = [];
  let a = 0;
  while (a < len - 1e-6) {
    const ph = (((a + off) % 1) + 1) % 1;
    const seg = Math.min(1 - ph, len - a);
    if (seg > 1e-4) out.push([a, ph, seg]);
    a += Math.max(seg, 1e-4);
  }
  return out;
}

const keyOf = p => {
  if (p.k === 'box') return (p.x0 + p.x1 + p.y0 + p.y1 + p.z0 + p.z1) / 2;
  if (p.k === 'cyl') return p.cx + p.cy + (p.z0 + p.z1) / 2;
  const pts = p.poly || p.pts;
  let s = 0;
  pts.forEach(q => { s += q[0] + q[1] + q[2]; });
  return s / pts.length;
};

function* boxFaces(b) {
  const refTop = b.refTop ?? b.z1;
  const h = b.z1 - b.z0;
  yield { k: 'face', role: 'top', tile: b.tT || b.tile, o: [b.x0, b.y0, b.z1], u: [b.x1 - b.x0, 0, 0], v: [0, b.y1 - b.y0, 0],
    poly: [[b.x0, b.y0, b.z1], [b.x1, b.y0, b.z1], [b.x1, b.y1, b.z1], [b.x0, b.y1, b.z1]] };
  yield { k: 'face', role: 'right', tile: b.tile, o: [b.x1, b.y0, b.z1], u: [0, b.y1 - b.y0, 0], v: [0, 0, -h], v0: refTop - b.z1,
    poly: [[b.x1, b.y0, b.z1], [b.x1, b.y1, b.z1], [b.x1, b.y1, b.z0], [b.x1, b.y0, b.z0]] };
  yield { k: 'face', role: 'left', tile: b.tile, o: [b.x0, b.y1, b.z1], u: [b.x1 - b.x0, 0, 0], v: [0, 0, -h], v0: refTop - b.z1,
    poly: [[b.x0, b.y1, b.z1], [b.x1, b.y1, b.z1], [b.x1, b.y1, b.z0], [b.x0, b.y1, b.z0]] };
}

function drawFace(g, f, T, S, ox, oy) {
  const tile = T(f.tile);
  const tex = faceTexture(tile, f.role);
  const size = tex.width;
  const lu = Math.hypot(...f.u), lv = Math.hypot(...f.v);
  if (lu < 1e-6 || lv < 1e-6) return;
  const uh = f.u.map(c => c / lu), vh = f.v.map(c => c / lv);
  const pu = projVec(uh, S), pv = projVec(vh, S);
  const pts = f.poly.map(p => proj(p, S, ox, oy));
  const path = () => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); };

  g.save();
  path(); g.clip();
  g.imageSmoothingEnabled = false;
  for (const [a, fu, su] of spans(lu, 0)) {
    for (const [b, fv, sv] of spans(lv, f.v0 || 0)) {
      const w = [f.o[0] + uh[0] * a + vh[0] * b, f.o[1] + uh[1] * a + vh[1] * b, f.o[2] + uh[2] * a + vh[2] * b];
      const p = proj(w, S, ox, oy);
      g.save();
      g.transform(pu[0] / size, pu[1] / size, pv[0] / size, pv[1] / size, p[0], p[1]);
      g.drawImage(tex, fu * size, fv * size, su * size, sv * size, 0, 0, su * size + 0.6, sv * size + 0.6);
      g.restore();
    }
  }
  if (f.shadeA) { path(); g.fillStyle = `rgba(0,0,0,${f.shadeA})`; g.fill(); }
  g.restore();

  g.save();
  path();
  g.strokeStyle = 'rgba(0,0,0,.38)';
  g.lineWidth = 1;
  g.stroke();
  g.restore();
}

function drawCyl(g, p, T, S, ox, oy) {
  const [cx, cy] = proj([p.cx, p.cy, 0], S, ox, oy);
  const rx = p.r * Math.SQRT2 * S, ry = (p.r * S) / Math.SQRT2;
  const yTop = cy - p.z1 * S, yBot = cy - p.z0 * S;
  const side = g.createPattern(faceTexture(T(p.tile), 'left'), 'repeat');
  const top = g.createPattern(faceTexture(T(p.tT || p.tile), 'top'), 'repeat');
  g.save();
  g.imageSmoothingEnabled = false;
  g.beginPath();
  g.moveTo(cx + rx, yTop); g.lineTo(cx + rx, yBot);
  g.ellipse(cx, yBot, rx, ry, 0, 0, Math.PI, false);
  g.lineTo(cx - rx, yTop); g.closePath();
  g.fillStyle = side; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.38)'; g.lineWidth = 1; g.stroke();
  g.beginPath(); g.ellipse(cx, yTop, rx, ry, 0, 0, Math.PI * 2);
  g.fillStyle = top; g.fill(); g.stroke();
  g.restore();
}

function resolvePrims(structure, { rot = 0, mirror = false } = {}) {
  return structure.build().map(p => transformPrim(p, { rot, mirror }));
}

function primPoints(p) {
  if (p.k === 'box') return [[p.x0, p.y0, p.z0], [p.x1, p.y1, p.z1], [p.x1, p.y0, p.z0], [p.x0, p.y1, p.z1]];
  if (p.k === 'cyl') return [[p.cx - p.r, p.cy - p.r, p.z0], [p.cx + p.r, p.cy + p.r, p.z1]];
  return p.poly || p.pts;
}

function structureBounds(prims, S) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  prims.forEach(p => primPoints(p).forEach(q => {
    const [x, y] = proj(q, S, 0, 0);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }));
  return { minX, maxX, minY, maxY };
}

/**
 * Draw one structure. (x, y) is where the centre of its 1×1 footprint lands
 * on screen, so a row of structures shares one ground line.
 */
function drawStructure(g, structure, tiles, { x = 0, y = 0, S = 40, rot = 0, mirror = false, alpha = 1 } = {}) {
  const idx = tiles instanceof Array ? tileIndex(tiles) : tiles;
  const fallback = { id: '_missing', top: '#ff00ff', bottom: '#aa00aa', split: 50 };
  const T = id => idx[id] || fallback;
  const ox = x, oy = y - 0.5 * S;
  const prims = resolvePrims(structure, { rot, mirror });
  const items = [];
  prims.forEach(p => {
    if (p.k === 'box') for (const f of boxFaces(p)) items.push({ ...f, layer: p.layer, key: keyOf(p), _box: true });
    else items.push({ ...p, key: keyOf(p) });
  });
  // box faces keep their box's sort key so a box's three faces stay together
  items.sort((a, b) => (a.layer - b.layer) || (a.key - b.key));

  g.save();
  g.globalAlpha = alpha;
  items.forEach(it => {
    if (it.n && dot(it.n, VIEW) <= 1e-9) return;
    if (it.k === 'face') drawFace(g, it, T, S, ox, oy);
    else if (it.k === 'cyl') drawCyl(g, it, T, S, ox, oy);
    else if (it.k === 'line') {
      g.beginPath();
      it.pts.map(p => proj(p, S, ox, oy)).forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
      g.strokeStyle = it.color; g.lineWidth = it.w; g.lineJoin = 'round'; g.stroke();
    }
  });
  g.restore();
}

/** Contact sheet of structures (used by the demo page and for palette art). */
function drawStructureSheet(g, structures, tiles, { S = 36, cols = 6, cellW = 130, cellH = 128, rot = 0, mirror = false, labels = true, bg = '#0d0d10' } = {}) {
  const rows = Math.ceil(structures.length / cols);
  g.fillStyle = bg;
  g.fillRect(0, 0, cols * cellW, rows * cellH);
  structures.forEach((s, i) => {
    const cx = (i % cols) * cellW + cellW / 2;
    const cy = Math.floor(i / cols) * cellH + cellH * 0.64;
    drawStructure(g, s, tiles, { x: cx, y: cy, S, rot, mirror });
    if (labels) {
      g.fillStyle = '#a0a0c0';
      g.font = '9px Inter, system-ui, sans-serif';
      g.textAlign = 'center';
      g.fillText(s.name, cx, Math.floor(i / cols) * cellH + cellH - 6);
    }
  });
  return { width: cols * cellW, height: rows * cellH };
}

const structurePreviewCache = new Map();
/** Small data-URL thumbnail for a structure palette button. */
function structurePreviewURL(structure, tiles = DEFAULT_TILES, { rot = 0, mirror = false, w = 88, h = 72, S = 24 } = {}) {
  const key = `${structure.id}|${rot}|${mirror}|${w}x${h}|${S}`;
  if (structurePreviewCache.has(key)) return structurePreviewCache.get(key);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  drawStructure(c.getContext('2d'), structure, tiles, { x: w / 2, y: h * 0.7, S, rot, mirror });
  const url = c.toDataURL();
  structurePreviewCache.set(key, url);
  return url;
}

/* ── tile-editor.js ── */
/**
 * tile-editor.js
 *
 * Self-contained tile editor for the Scene Studio tile library.
 * Edits the live tile objects (colours, split, top/bottom dither) in place, so
 * anything drawn with faceTexture()/structures.js updates as soon as onChange fires.
 *
 *   const editor = createTileEditor(document.getElementById('editor'), {
 *     tiles: DEFAULT_TILES, sets: DEFAULT_SETS, groups: DEFAULT_GROUPS,
 *     startSet: 'town', onChange: id => redraw(), onSelect: id => {},
 *   });
 *
 * Edits autosave to localStorage (only the tiles that differ from the defaults).
 */


const DITHER_MODES = [
  'solid', 'noise', 'lines', 'crosshatch', 'dots', 'random',
  'brick', 'paving', 'checker', 'weave', 'plank', 'shingle', 'stonework', 'lattice',
];
const BLEND_MODES = [
  ['source-over', 'Normal'], ['multiply', 'Multiply'], ['screen', 'Screen'],
  ['overlay', 'Overlay'], ['soft-light', 'Soft light'], ['hard-light', 'Hard light'],
];

const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const pickTile = t => ({ name: t.name, top: t.top, bottom: t.bottom, split: t.split, topDither: { ...t.topDither }, bottomDither: { ...t.bottomDither } });

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  kids.flat().forEach(c => { if (c != null) el.append(c.nodeType ? c : document.createTextNode(c)); });
  return el;
}

function downloadText(name, text, type = 'text/plain') {
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([text], { type }));
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/** Keep only valid values from untrusted input (imported JSON, localStorage). */
function sanitize(o) {
  const out = {};
  if (!o || typeof o !== 'object') return out;
  const hex = v => (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : null);
  const num = v => (Number.isFinite(+v) ? Math.max(0, Math.min(100, Math.round(+v))) : null);
  if (typeof o.name === 'string' && o.name.trim()) out.name = o.name.trim().slice(0, 40);
  if (hex(o.top)) out.top = hex(o.top);
  if (hex(o.bottom)) out.bottom = hex(o.bottom);
  if (num(o.split) != null) out.split = num(o.split);
  ['topDither', 'bottomDither'].forEach(key => {
    const d = o[key];
    if (!d || typeof d !== 'object') return;
    const s = {};
    if (DITHER_MODES.includes(d.mode)) s.mode = d.mode;
    if (d.ink === 'bright' || d.ink === 'dark') s.ink = d.ink;
    if (BLEND_MODES.some(b => b[0] === d.blendMode)) s.blendMode = d.blendMode;
    ['bright', 'space', 'thick', 'blend'].forEach(f => { if (num(d[f]) != null) s[f] = num(d[f]); });
    out[key] = s;
  });
  return out;
}

function createTileEditor(root, opts = {}) {
  const {
    tiles = DEFAULT_TILES, sets = DEFAULT_SETS, groups = DEFAULT_GROUPS,
    storageKey = 'pixelIsometric.tileEditor.v1', onChange = () => {}, onSelect = () => {},
    startSet = sets[0] && sets[0].id,
  } = opts;

  tiles.forEach(normalizeTile);
  const byId = Object.fromEntries(tiles.map(t => [t.id, t]));
  const defaults = Object.fromEntries(tiles.map(t => [t.id, clone(pickTile(t))]));
  const setOfGroup = Object.fromEntries(groups.map(g => [g.id, g.setId]));

  let setId = startSet;
  let selectedId = null;
  const history = [];
  let hi = -1;
  const controls = [];          // fns that copy the selected tile into the inputs
  const thumbs = {};            // tile id -> { btn, img, label }

  const cur = () => byId[selectedId];

  /* ───────── state helpers ───────── */

  const snapshot = () => JSON.stringify(Object.fromEntries(tiles.map(t => [t.id, pickTile(t)])));
  function applyMap(map) {
    for (const [id, o] of Object.entries(map)) {
      const t = byId[id];
      if (!t) continue;
      const s = sanitize(o);
      const { topDither, bottomDither, ...flat } = s;
      Object.assign(t, flat);
      if (topDither) t.topDither = { ...t.topDither, ...topDither };
      if (bottomDither) t.bottomDither = { ...t.bottomDither, ...bottomDither };
    }
  }
  const changedMap = () => {
    const out = {};
    tiles.forEach(t => { if (JSON.stringify(pickTile(t)) !== JSON.stringify(defaults[t.id])) out[t.id] = pickTile(t); });
    return out;
  };
  function persist() {
    try { localStorage.setItem(storageKey, JSON.stringify({ v: 1, tiles: changedMap() })); } catch (e) { /* storage unavailable */ }
  }
  function pushHistory() {
    const s = snapshot();
    if (history[hi] === s) return;
    history.length = hi + 1;
    history.push(s);
    if (history.length > 100) history.shift();
    hi = history.length - 1;
    updateButtons();
  }

  /* ───────── DOM ───────── */

  if (!document.getElementById('te-style')) document.head.appendChild(h('style', { id: 'te-style', text: STYLE }));
  root.innerHTML = '';
  root.classList.add('te-root');

  const status = h('div', { class: 'te-status' });
  const say = (html) => { status.innerHTML = html; };

  const btnUndo = h('button', { text: 'Undo', title: 'Undo (Ctrl/Cmd+Z)', onclick: () => undo() });
  const btnRedo = h('button', { text: 'Redo', title: 'Redo (Ctrl/Cmd+Shift+Z)', onclick: () => redo() });
  const btnResetTile = h('button', { class: 'danger', text: 'Reset tile', onclick: () => resetTile() });
  const btnResetAll = h('button', { class: 'danger', text: 'Reset all', onclick: () => resetAll() });

  const setSelect = h('select', { onchange: e => { setId = e.target.value; renderPalette(); const first = tiles.find(t => setOfGroup[t.groupId] === setId); if (first) select(first.id); } },
    sets.map(s => h('option', { value: s.id, text: s.name })));
  const palette = h('div', { class: 'te-palscroll' });

  const previewCanvas = h('canvas', { class: 'te-preview', width: 260, height: 204 });

  const nameInput = h('input', { type: 'text', maxlength: 40 });
  nameInput.addEventListener('input', () => { cur().name = nameInput.value || cur().id; const th = thumbs[selectedId]; if (th) th.label.textContent = cur().name; onChange(selectedId); });
  nameInput.addEventListener('change', commit);
  controls.push(() => { nameInput.value = cur().name; });

  function colorRow(label, key) {
    const c = h('input', { type: 'color' });
    const t = h('input', { type: 'text', maxlength: 7, spellcheck: 'false', class: 'te-hex' });
    c.addEventListener('input', () => { cur()[key] = c.value; t.value = c.value; changed(); });
    c.addEventListener('change', commit);
    t.addEventListener('change', () => {
      const m = /^#?([0-9a-f]{6})$/i.exec(t.value.trim());
      if (m) { cur()[key] = '#' + m[1].toLowerCase(); c.value = cur()[key]; t.value = cur()[key]; changed(); commit(); } else t.value = cur()[key];
    });
    controls.push(() => { c.value = cur()[key]; t.value = cur()[key]; });
    return h('div', { class: 'te-row' }, h('label', { text: label }), c, t);
  }
  function sliderRow(label, get, set) {
    const input = h('input', { type: 'range', min: 0, max: 100, step: 1 });
    const val = h('span', { class: 'te-val' });
    input.addEventListener('input', () => { set(+input.value); val.textContent = input.value; changed(); });
    input.addEventListener('change', commit);
    controls.push(() => { input.value = get(); val.textContent = input.value; });
    return h('div', { class: 'te-row' }, h('label', { text: label }), input, val);
  }
  function selectRow(label, options, get, set) {
    const sel = h('select', {}, options.map(([v, l]) => h('option', { value: v, text: l })));
    sel.addEventListener('change', () => { set(sel.value); changed(); commit(); });
    controls.push(() => { sel.value = get(); });
    return h('div', { class: 'te-row' }, h('label', { text: label }), sel);
  }
  function ditherSection(key, title) {
    const d = () => cur()[key];
    return h('div', {},
      h('h3', { class: 'te-sub', text: title }),
      selectRow('Mode', DITHER_MODES.map(m => [m, cap(m)]), () => d().mode, v => { d().mode = v; }),
      selectRow('Ink type', [['bright', 'Bright'], ['dark', 'Dark']], () => d().ink, v => { d().ink = v; }),
      selectRow('Blend mode', BLEND_MODES, () => d().blendMode || 'source-over', v => { d().blendMode = v; }),
      sliderRow('Bright', () => d().bright, v => { d().bright = v; }),
      sliderRow('Space', () => d().space, v => { d().space = v; }),
      sliderRow('Thick', () => d().thick, v => { d().thick = v; }),
      sliderRow('Blend', () => d().blend, v => { d().blend = v; }),
    );
  }

  const fileInput = h('input', { type: 'file', accept: 'application/json,.json', style: 'display:none' });
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try { importJSON(JSON.parse(await f.text())); } catch (e) { say('Could not read that file as JSON.'); }
  });

  root.append(
    h('section', { class: 'te-sec' },
      h('h2', { class: 'te-h', text: 'Tile Editor' }),
      h('div', { class: 'te-btns three' }, btnUndo, btnRedo, btnResetTile),
      h('div', { class: 'te-row' }, h('label', { text: 'Set' }), setSelect),
      palette,
    ),
    h('section', { class: 'te-sec' },
      h('h2', { class: 'te-h', text: 'Live Tile' }),
      previewCanvas,
      h('div', { class: 'te-row' }, h('label', { text: 'Name' }), nameInput),
      h('h3', { class: 'te-sub', text: 'Geometry' }),
      colorRow('Top colour', 'top'),
      colorRow('Bottom colour', 'bottom'),
      sliderRow('Split', () => cur().split, v => { cur().split = v; }),
      ditherSection('topDither', 'Top Pattern'),
      ditherSection('bottomDither', 'Bottom Pattern'),
    ),
    h('section', { class: 'te-sec' },
      h('h2', { class: 'te-h', text: 'Save & Share' }),
      h('div', { class: 'te-btns' },
        h('button', { text: 'Export edits (JSON)', onclick: () => exportJSON() }),
        h('button', { text: 'Import JSON…', onclick: () => fileInput.click() }),
        h('button', { text: 'Export set as config.js', onclick: () => exportConfig() }),
        btnResetAll,
      ),
      fileInput,
      status,
    ),
  );

  /* ───────── rendering ───────── */

  function drawPreview() {
    const t = cur();
    if (!t) return;
    const g = previewCanvas.getContext('2d');
    g.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
    g.fillStyle = '#09090c';
    g.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
    g.imageSmoothingEnabled = false;
    const k = 3, ox = 10, oy = 6;
    const sc = pts => pts.map(([x, y]) => [x * k + ox, y * k + oy]);
    drawTextureQuad(g, sc([[10, 23], [40, 39], [40, 57], [10, 41]]), faceTexture(t, 'left'));
    drawTextureQuad(g, sc([[40, 39], [70, 23], [70, 41], [40, 57]]), faceTexture(t, 'right'));
    drawTextureQuad(g, sc([[40, 7], [70, 23], [40, 39], [10, 23]]), faceTexture(t, 'top'));
  }

  function updateThumb(id) {
    const th = thumbs[id];
    if (th) { th.img.src = tilePreviewURL(byId[id]); th.label.textContent = byId[id].name; }
  }

  function renderPalette() {
    palette.innerHTML = '';
    Object.keys(thumbs).forEach(k => delete thumbs[k]);
    setSelect.value = setId;
    groups.filter(g => g.setId === setId).forEach(g => {
      const list = tiles.filter(t => t.groupId === g.id);
      if (!list.length) return;
      const grid = h('div', { class: 'te-pal' });
      list.forEach(t => {
        const img = h('img', { alt: '', src: tilePreviewURL(t) });
        const label = h('span', { text: t.name });
        const btn = h('button', { class: 'te-tile' + (t.id === selectedId ? ' active' : ''), title: t.name, 'data-id': t.id, onclick: () => select(t.id) }, img, label);
        thumbs[t.id] = { btn, img, label };
        grid.appendChild(btn);
      });
      palette.appendChild(h('div', { class: 'te-pal-group' }, h('h3', { text: g.name }), grid));
    });
  }

  function syncControls() { controls.forEach(fn => fn()); }
  function updateButtons() {
    btnUndo.disabled = hi <= 0;
    btnRedo.disabled = hi >= history.length - 1;
  }

  /* ───────── actions ───────── */

  function changed() {
    drawPreview();
    updateThumb(selectedId);
    onChange(selectedId);
  }
  function commit() {
    pushHistory();
    persist();
    const n = Object.keys(changedMap()).length;
    say(n ? `<b>${n}</b> tile${n === 1 ? '' : 's'} edited · autosaved in this browser` : 'No edits yet · autosaves in this browser');
  }

  function select(id) {
    if (!byId[id]) return;
    const s = setOfGroup[byId[id].groupId];
    if (s && s !== setId) { setId = s; selectedId = id; renderPalette(); }
    selectedId = id;
    Object.entries(thumbs).forEach(([k, th]) => th.btn.classList.toggle('active', k === id));
    syncControls();
    drawPreview();
    onSelect(id);
  }

  function refreshAll() {
    Object.keys(thumbs).forEach(updateThumb);
    syncControls();
    drawPreview();
  }

  function restore(snap) {
    applyMap(JSON.parse(snap));
    refreshAll();
    onChange(null);
    persist();
  }
  function undo() { if (hi > 0) { hi--; restore(history[hi]); updateButtons(); } }
  function redo() { if (hi < history.length - 1) { hi++; restore(history[hi]); updateButtons(); } }

  function resetTile() {
    if (!selectedId) return;
    applyMap({ [selectedId]: defaults[selectedId] });
    // dithers were merged field-by-field above, so write them back whole
    cur().topDither = { ...defaults[selectedId].topDither };
    cur().bottomDither = { ...defaults[selectedId].bottomDither };
    refreshAll(); onChange(selectedId); commit();
  }
  function resetAll() {
    tiles.forEach(t => {
      const d = defaults[t.id];
      Object.assign(t, { name: d.name, top: d.top, bottom: d.bottom, split: d.split });
      t.topDither = { ...d.topDither };
      t.bottomDither = { ...d.bottomDither };
    });
    refreshAll(); onChange(null); commit();
  }

  function exportJSON() {
    const map = changedMap();
    const n = Object.keys(map).length;
    downloadText('tile-edits.json', JSON.stringify({ app: 'pixel-isometric-tile-editor', version: 1, tiles: map }, null, 2), 'application/json');
    say(`Exported <b>${n}</b> edited tile${n === 1 ? '' : 's'} (only tiles that differ from the defaults).`);
    return map;
  }
  function importJSON(data) {
    let map = data && data.tiles;
    if (Array.isArray(map)) map = Object.fromEntries(map.filter(t => t && t.id).map(t => [t.id, t]));
    if (!map || typeof map !== 'object') { say('That file has no tiles in it.'); return 0; }
    const ids = Object.keys(map).filter(id => byId[id]);
    ids.forEach(id => {
      const s = sanitize(map[id]);
      const { topDither, bottomDither, ...flat } = s;
      Object.assign(byId[id], flat);
      if (topDither) byId[id].topDither = { ...byId[id].topDither, ...topDither };
      if (bottomDither) byId[id].bottomDither = { ...byId[id].bottomDither, ...bottomDither };
    });
    refreshAll(); onChange(null); commit();
    say(`Imported <b>${ids.length}</b> tile${ids.length === 1 ? '' : 's'}${ids.length < Object.keys(map).length ? ' (unknown ids skipped)' : ''}.`);
    return ids.length;
  }
  function configText(forSet = setId) {
    const gs = new Set(groups.filter(g => g.setId === forSet).map(g => g.id));
    const q = s => `'${String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'`;
    const d = x => `dither(${q(x.mode)}, ${q(x.ink)}, ${x.bright}, ${x.space}, ${x.thick}, ${x.blend}, ${q(x.blendMode || 'source-over')})`;
    const list = tiles.filter(t => gs.has(t.groupId));
    const setName = (sets.find(s => s.id === forSet) || {}).name || forSet;
    return `// ${setName} tiles — paste into DEFAULT_TILES in config.js (replaces the existing entries with the same ids)\n` +
      list.map(t => `  tile(${q(t.id)}, ${q(t.name)}, ${q(t.groupId)}, ${q(t.top)}, ${q(t.bottom)}, ${t.split},\n    ${d(t.topDither)}, ${d(t.bottomDither)}),`).join('\n') + '\n';
  }
  function exportConfig() {
    downloadText(`${setId}-tiles.config.js`, configText(setId), 'text/javascript');
    say('Exported the tiles in this set in <b>config.js</b> format.');
  }

  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;
    const t = e.target;
    if (t && t.tagName === 'INPUT' && t.type === 'text') return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  });

  /* ───────── boot ───────── */

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && saved.tiles) applyMap(saved.tiles);
  } catch (e) { /* ignore bad or missing storage */ }

  renderPalette();
  const first = tiles.find(t => setOfGroup[t.groupId] === setId) || tiles[0];
  pushHistory();
  select(first.id);
  commit();

  return {
    select, undo, redo, resetAll, resetTile, exportJSON, importJSON, exportConfig, configText,
    refresh: refreshAll,
    getSelected: () => selectedId,
    getTile: id => byId[id],
    changed: changedMap,
  };
}


/* ── page ── */
const canvas = document.getElementById('sheet');
const cols = 6, cellW = 150, cellH = 140;
let rot = 0, mirror = false, S = 38, with90 = true, onlyUsing = false;
let selTile = null, selStruct = null, lastList = [];

const tileName = id => (editor.getTile(id) || { name: id }).name;

function currentList() {
  let list = with90 ? STRUCTURES_WITH_90 : STRUCTURES;
  if (onlyUsing && selTile) list = list.filter(s => structureTiles(s).includes(selTile));
  return list;
}

function updateInfo() {
  const box = document.getElementById('structTiles');
  box.innerHTML = '';
  const nameEl = document.getElementById('structName');
  if (!selStruct) { nameEl.textContent = 'Click a structure in the sheet'; return; }
  nameEl.textContent = selStruct.name;
  structureTiles(selStruct).forEach(id => {
    const b = document.createElement('button');
    b.className = 'chip' + (id === selTile ? ' active' : '');
    b.textContent = tileName(id);
    b.title = 'Edit this tile';
    b.onclick = () => editor.select(id);
    box.appendChild(b);
  });
}

function draw() {
  lastList = currentList();
  const rows = Math.max(1, Math.ceil(lastList.length / cols));
  canvas.width = cols * cellW;
  canvas.height = rows * cellH;
  const g = canvas.getContext('2d');
  drawStructureSheet(g, lastList, DEFAULT_TILES, { S, cols, cellW, cellH, rot, mirror });
  const idx = selStruct ? lastList.findIndex(s => s.id === selStruct.id) : -1;
  if (idx >= 0) {
    g.strokeStyle = '#3ecfb2'; g.lineWidth = 2;
    g.strokeRect((idx % cols) * cellW + 3, Math.floor(idx / cols) * cellH + 3, cellW - 6, cellH - 6);
  }
  document.getElementById('state').textContent = lastList.length + ' pieces \u00b7 rot ' + (rot * 90) + '\u00b0 \u00b7 ' + (mirror ? 'mirrored' : 'no mirror');
  if (selTile) {
    const n = (with90 ? STRUCTURES_WITH_90 : STRUCTURES).filter(s => structureTiles(s).includes(selTile)).length;
    document.getElementById('usedBy').textContent = 'Used by ' + n + ' structure' + (n === 1 ? '' : 's');
  }
}

const editor = createTileEditor(document.getElementById('editor'), {
  tiles: DEFAULT_TILES, sets: DEFAULT_SETS, groups: DEFAULT_GROUPS, startSet: 'town',
  storageKey: 'pixelIsometric.sceneStudio.tileEdits.v1',
  onChange: () => draw(),
  onSelect: id => { selTile = id; updateInfo(); draw(); },
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  const i = Math.floor(y / cellH) * cols + Math.floor(x / cellW);
  selStruct = lastList[i] || null;
  updateInfo();
  draw();
});
document.getElementById('rotCW').onclick = () => { rot = (rot + 1) % 4; draw(); };
document.getElementById('rotCCW').onclick = () => { rot = (rot + 3) % 4; draw(); };
document.getElementById('mirror').onclick = e => { mirror = !mirror; e.currentTarget.classList.toggle('active', mirror); draw(); };
document.getElementById('with90').onchange = e => { with90 = e.target.checked; draw(); };
document.getElementById('onlyUsing').onchange = e => { onlyUsing = e.target.checked; draw(); };
document.getElementById('scale').oninput = e => { S = +e.target.value; document.getElementById('scaleV').textContent = S; draw(); };
updateInfo();
draw();

</script>
</body>
