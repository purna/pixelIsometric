<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Studio — Structures</title>
<style>
:root{--bg:#0d0d10;--panel:#111115;--line:#2a2a38;--ink:#a0a0c0;--muted:#616174;--accent:#3ecfb2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{padding:14px;display:grid;gap:12px;justify-items:start}
.brand{font:700 12px 'Press Start 2P',ui-monospace,monospace;color:var(--accent);letter-spacing:.03em}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;background:#0f0f14;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer}
button:hover,button.active{border-color:var(--accent);color:#fff}
button.active{background:#14342f;color:var(--accent)}
label{color:var(--muted)}
input[type=range]{accent-color:var(--accent);vertical-align:middle}
.value{color:var(--accent);display:inline-block;min-width:28px;text-align:right}
.sub{color:var(--muted)}
.hint{color:var(--muted);line-height:1.5;margin:0;max-width:720px}
#sheet{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#0d0d10;image-rendering:pixelated}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">STRUCTURES</div>
  <div class="bar">
    <button id="rotCCW">&#10226; Rotate</button>
    <button id="rotCW">Rotate &#10227;</button>
    <button id="mirror">Mirror</button>
    <label><input id="with90" type="checkbox" checked> Show 90&deg; versions</label>
    <label>Scale <input id="scale" type="range" min="24" max="56" value="38"></label><span class="value" id="scaleV">38</span>
    <span class="sub" id="state">rot 0&deg; &middot; no mirror</span>
  </div>
  <canvas id="sheet"></canvas>
  <p class="hint">Every structure fits one 1&times;1 cell. Rotate and Mirror re-orient the whole sheet. Self-contained: tiles, textures and structures are all inlined, so this file works when opened directly.</p>
</div>

/* ── textures.js ── */

const textureCache = new Map();
const previewCache = new Map();

function hexToRgb(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgbToHex(r, g, b) {
  const c = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
  return `#${c(r)}${c(g)}${c(b)}`;
}

function shade(hex, amount) {
  const c = hexToRgb(hex);
  const f = v => amount >= 0 ? v + (255 - v) * amount : v * (1 + amount);
  return rgbToHex(f(c.r), f(c.g), f(c.b));
}

function normalizeTile(tile) {
  tile.bottom ??= shade(tile.top, -0.32);
  tile.split ??= 55;
  tile.topDither ??= { mode: 'noise', ink: 'bright', bright: 65, space: 42, thick: 32, blend: 65, blendMode: 'source-over' };
  tile.bottomDither ??= { mode: 'noise', ink: 'dark', bright: 55, space: 42, thick: 32, blend: 65, blendMode: 'source-over' };
  tile.topDither.blendMode ??= 'source-over';
  tile.bottomDither.blendMode ??= 'source-over';
  return tile;
}

function stringSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function hash2(x, y, seed) {
  let n = (x * 374761393 + y * 668265263 + seed * 69069) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

function inkColor(base, s) {
  return shade(base, s.ink === 'dark' ? -(0.12 + (s.bright / 100) * 0.55) : (0.12 + (s.bright / 100) * 0.55));
}

function patternAt(x, y, s, seed) {
  if (!s || s.mode === 'solid') return false;
  const space = 1 + Math.round((s.space / 100) * 6);
  const thick = 1 + Math.round((s.thick / 100) * 3);
  const density = 0.12 + (s.bright / 100) * 0.62;
  const sx = x + (seed % 17);
  const sy = y + ((seed >> 4) % 19);
  if (s.mode === 'lines') return ((sx + sy) % space) < thick;
  if (s.mode === 'crosshatch') return ((sx + sy) % space) < thick || ((sx - sy + 1000) % space) < thick;
  if (s.mode === 'dots') return (sx % space === 0 && sy % space === 0) || (thick > 2 && sx % space === 1 && sy % space === 0);
  if (s.mode === 'noise') {
    const block = 1 + Math.round((s.space / 100) * 1.5);
    return hash2(Math.floor(x / block), Math.floor(y / block), seed) < density;
  }
  if (s.mode === 'random') {
    const block = 1 + Math.round((s.space / 100) * 3);
    return hash2(Math.floor(x / block), Math.floor(y / block), seed) < density;
  }
  if (s.mode === 'brick') {
    const bh = 2 + Math.round((100 - s.space) / 22);
    const bw = bh * 2;
    const row = Math.floor(y / bh);
    const offset = (row % 2) * Math.floor(bw / 2);
    return (y % bh === 0) || ((x + offset) % bw === 0);
  }
  if (s.mode === 'paving') {
    const block = 3 + Math.round((100 - s.space) / 18);
    return (x % block === 0) || (y % block === 0);
  }
  if (s.mode === 'checker') {
    const block = 1 + Math.round((100 - s.space) / 18);
    return (Math.floor(x / block) + Math.floor(y / block)) % 2 === 0;
  }
  if (s.mode === 'weave') {
    const block = 2 + Math.round((100 - s.space) / 20);
    const cx = Math.floor(x / block), cy = Math.floor(y / block);
    const horizontal = (cx + cy) % 2 === 0;
    return horizontal ? (y % block < thick) : (x % block < thick);
  }
  if (s.mode === 'plank') {
    const bh = 3 + Math.round((100 - s.space) / 25);
    const bw = bh * 5;
    const row = Math.floor(y / bh);
    const offset = Math.floor(hash2(row, 7, seed) * bw);
    return (y % bh === 0) || ((x + offset) % bw === 0);
  }
  if (s.mode === 'shingle') {
    const bh = 4 + Math.round((100 - s.space) / 20);
    const bw = bh + 2;
    const row = Math.floor(y / bh);
    const off = (row % 2) * Math.floor(bw / 2);
    const inRow = y % bh;
    return (inRow === bh - 1) || (inRow >= Math.floor(bh / 2) && (x + off) % bw === 0);
  }
  if (s.mode === 'stonework') {
    const bh = 5 + Math.round((100 - s.space) / 25);
    const row = Math.floor(y / bh);
    const bw = 7 + Math.floor(hash2(row, 3, seed) * 7);
    const off = Math.floor(hash2(row, 11, seed) * bw);
    return (y % bh === 0) || ((x + off) % bw === 0);
  }
  if (s.mode === 'lattice') {
    const gap = 5 + Math.round((100 - s.space) / 20);
    const edge = x < 2 || y < 2 || x >= TEXTURE_SIZE - 2 || y >= TEXTURE_SIZE - 2;
    return edge || ((x + y) % gap) < 1 || ((x - y + 1000) % gap) < 1;
  }
  return false;
}

function ditherKey(s) {
  return s ? `${s.mode},${s.ink},${s.bright},${s.space},${s.thick},${s.blend},${s.blendMode || 'source-over'}` : '';
}

function textureKey(tile, face) {
  return `${face}|${tile.id}|${tile.top}|${tile.bottom}|${tile.split}|${ditherKey(tile.topDither)}|${ditherKey(tile.bottomDither)}`;
}

function applyDither(g, tile, s, seed, y0, y1, base) {
  if (!s || s.mode === 'solid' || y1 <= y0) return;
  g.save();
  g.globalAlpha = 0.12 + (s.blend / 100) * 0.88;
  g.globalCompositeOperation = s.blendMode || 'source-over';
  g.fillStyle = inkColor(base, s);
  for (let y = Math.floor(y0); y < Math.ceil(y1); y++) {
    for (let x = 0; x < TEXTURE_SIZE; x++) if (patternAt(x, y, s, seed)) g.fillRect(x, y, 1, 1);
  }
  g.restore();
}

function faceTexture(tile, face) {
  normalizeTile(tile);
  const key = textureKey(tile, face);
  const cached = textureCache.get(key);
  if (cached) return cached;

  const size = TEXTURE_SIZE;
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  const split = Math.max(0, Math.min(1, (Number(tile.split) || 0) / 100));
  const seed = stringSeed(tile.id + face);

  if (face === 'top') {
    g.fillStyle = tile.top;
    g.fillRect(0, 0, size, size);
    applyDither(g, tile, tile.topDither, seed, 0, size, tile.top);
  } else {
    const left = face === 'left';
    const topColor = left ? shade(tile.top, -0.12) : shade(tile.top, 0.02);
    const bottomBase = tile.bottom || tile.top;
    const bottomColor = left ? shade(bottomBase, -0.12) : shade(bottomBase, 0.02);
    const splitY = Math.round(size * split);
    g.fillStyle = topColor;
    g.fillRect(0, 0, size, splitY);
    g.fillStyle = bottomColor;
    g.fillRect(0, splitY, size, size - splitY);
    applyDither(g, tile, tile.topDither, seed + 37, 0, splitY, topColor);
    applyDither(g, tile, tile.bottomDither, seed + 101, splitY, size, bottomColor);
  }

  textureCache.set(key, c);
  return c;
}

function drawTextureTri(g, points, texture, alpha = 1) {
  if (!texture) return;
  const [p0, p1, p2] = points;
  const size = texture.width;
  const ux = (p1[0] - p0[0]) / size;
  const uy = (p1[1] - p0[1]) / size;
  const vx = (p2[0] - p0[0]) / size;
  const vy = (p2[1] - p0[1]) / size;
  g.save();
  g.globalAlpha = alpha;
  g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.closePath(); g.clip();
  g.transform(ux, uy, vx, vy, p0[0], p0[1]);
  g.drawImage(texture, 0, 0);
  g.restore();
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.lineTo(p2[0], p2[1]); g.closePath(); g.stroke();
  g.restore();
}

function drawTextureQuad(g, points, texture, alpha = 1) {
  if (!texture) return;
  const [p0, p1, , p3] = points;
  const size = texture.width;
  const ux = (p1[0] - p0[0]) / size;
  const uy = (p1[1] - p0[1]) / size;
  const vx = (p3[0] - p0[0]) / size;
  const vy = (p3[1] - p0[1]) / size;

  g.save();
  g.globalAlpha = alpha;
  g.beginPath();
  g.moveTo(points[0][0], points[0][1]);
  points.slice(1).forEach(pt => g.lineTo(pt[0], pt[1]));
  g.closePath();
  g.clip();
  g.transform(ux, uy, vx, vy, p0[0], p0[1]);
  g.drawImage(texture, 0, 0);
  g.restore();

  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = 'rgba(0,0,0,.4)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(points[0][0], points[0][1]);
  points.slice(1).forEach(pt => g.lineTo(pt[0], pt[1]));
  g.closePath();
  g.stroke();
  g.restore();
}

function previewKey(tile) {
  return `${tile.top}|${tile.bottom}|${tile.split}|${ditherKey(tile.topDither)}|${ditherKey(tile.bottomDither)}`;
}

function tilePreviewURL(tile) {
  normalizeTile(tile);
  const key = previewKey(tile);
  if (previewCache.has(key)) return previewCache.get(key);

  const c = document.createElement('canvas');
  c.width = 80;
  c.height = 64;
  const g = c.getContext('2d');
  const top = [[40, 7], [70, 23], [40, 39], [10, 23]];
  const left = [[10, 23], [40, 39], [40, 57], [10, 41]];
  const right = [[40, 39], [70, 23], [70, 41], [40, 57]];
  drawTextureQuad(g, left, faceTexture(tile, 'left'));
  drawTextureQuad(g, right, faceTexture(tile, 'right'));
  drawTextureQuad(g, top, faceTexture(tile, 'top'));

  const url = c.toDataURL();
  previewCache.set(key, url);
  return url;
}

/* ── structures.js ── */
/**
 * structures.js
 *
 * Multi-face isometric structures (roofs, walls, doors, steps, wells, props…)
 * built from the Town tile set in config.js and drawn with textures.js.
 *
 * Coordinate system (matches two-d-view.js / the ramp prototype):
 *   screen x = (x - y) * S      screen y = (x + y) * 0.5 * S - z * S
 *   Visible faces point toward +x ("right"), +y ("left") and +z ("top").
 *   Every structure fits inside one 1×1 cell, 0 → 1 on x and y.
 *
 * Each structure is { id, name, group, build() } where build() returns a list
 * of primitives (box / cyl / face / line). Use rot (0-3) and mirror (swap x/y)
 * at draw time to get every orientation from one definition.
 */


/* ───────────────────────── math helpers ───────────────────────── */

const VIEW = [1, 1, 1];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const proj = ([x, y, z], S, ox, oy) => [ox + (x - y) * S, oy + (x + y) * 0.5 * S - z * S];
const projVec = ([x, y, z], S) => [(x - y) * S, (x + y) * 0.5 * S - z * S];

function tileIndex(tiles = DEFAULT_TILES) {
  const map = {};
  tiles.forEach(t => { map[t.id] = t; });
  return map;
}

/* ───────────────────────── primitive builders ───────────────────────── */

// Axis-aligned box. tile = side tile id, tT = top tile id, refTop = z that the
// side texture's first row is anchored to (keeps plaster/stone bands aligned
// across wall pieces of different heights).
const box = (x0, y0, z0, x1, y1, z1, tile, o = {}) => ({ k: 'box', x0, y0, z0, x1, y1, z1, tile, layer: 0, ...o });
const cyl = (cx, cy, z0, z1, r, tile, o = {}) => ({ k: 'cyl', cx, cy, z0, z1, r, tile, layer: 0, ...o });
// Parallelogram face: o + a*u + b*v. u runs across, v runs DOWN the texture.
const quad = (o, u, v, tile, role, n, x = {}) => ({
  k: 'face', o, u, v, poly: [o, add(o, u), add(add(o, u), v), add(o, v)], tile, role, n, layer: 0, ...x,
});
// Triangle clipped out of the parallelogram o,u,v.
const tri = (poly, o, u, v, tile, role, n, x = {}) => ({ k: 'face', o, u, v, poly, tile, role, n, layer: 0, ...x });
const line = (pts, n, color = '#49342d', w = 2) => ({ k: 'line', pts, n, color, w, layer: 2 });

/* ───────────────────────── transforms ───────────────────────── */

function tp(p, { mirror, rot }) {
  let [x, y, z] = p;
  if (mirror) [x, y] = [y, x];
  for (let i = 0; i < (rot | 0); i++) [x, y] = [1 - y, x];
  return [x, y, z];
}
function tv(v, { mirror, rot }) {
  let [x, y, z] = v;
  if (mirror) [x, y] = [y, x];
  for (let i = 0; i < (rot | 0); i++) [x, y] = [-y, x];
  return [x, y, z];
}
function transformPrim(p, o) {
  if (!o.mirror && !o.rot) return p;
  if (p.k === 'box') {
    const a = tp([p.x0, p.y0, p.z0], o), b = tp([p.x1, p.y1, p.z1], o);
    return { ...p, x0: Math.min(a[0], b[0]), x1: Math.max(a[0], b[0]), y0: Math.min(a[1], b[1]), y1: Math.max(a[1], b[1]) };
  }
  if (p.k === 'cyl') {
    const c = tp([p.cx, p.cy, 0], o);
    return { ...p, cx: c[0], cy: c[1] };
  }
  if (p.k === 'face') {
    return { ...p, o: tp(p.o, o), u: tv(p.u, o), v: tv(p.v, o), poly: p.poly.map(q => tp(q, o)), n: p.n && tv(p.n, o) };
  }
  return { ...p, pts: p.pts.map(q => tp(q, o)), n: p.n && tv(p.n, o) };
}
const mirrorList = list => list.map(p => transformPrim(p, { mirror: true, rot: 0 }));

function lift(list, dz) {
  const L = p => [p[0], p[1], p[2] + dz];
  return list.map(p => {
    if (p.k === 'box') return { ...p, z0: p.z0 + dz, z1: p.z1 + dz, refTop: (p.refTop ?? p.z1) + dz };
    if (p.k === 'cyl') return { ...p, z0: p.z0 + dz, z1: p.z1 + dz };
    if (p.k === 'face') return { ...p, o: L(p.o), poly: p.poly.map(L) };
    return { ...p, pts: p.pts.map(L) };
  });
}

/* ───────────────────────── composite builders ───────────────────────── */

// Open-topped hollow block (wells, keeps, pillars, planters).
function hollow({ h, rim, tile, floorZ, floorTop, x0 = 0, y0 = 0, x1 = 1, y1 = 1, floorTile }) {
  return [
    box(x0 + rim, y0 + rim, 0, x1 - rim, y1 - rim, floorZ, floorTile || tile, { tT: floorTop }),
    box(x0, y0, 0, x0 + rim, y1, h, tile, { tT: tile }),                         // back (low x)
    box(x0 + rim, y0, 0, x1, y0 + rim, h, tile, { tT: tile }),                   // back (low y)
    box(x1 - rim, y0 + rim, 0, x1, y1, h, tile, { tT: tile }),                   // front (high x)
    box(x0 + rim, y1 - rim, 0, x1 - rim, y1, h, tile, { tT: tile }),             // front (high y)
  ];
}

const WT = 0.2, WH = 0.9, RAIL = 0.1, DH = 0.62;

// Wall running along y at the low-x edge (visible face points +x).
// kind: plain | door | doorOpen | doorway | window
function wallY(kind = 'plain', y0 = 0, y1 = 1) {
  const L = y1 - y0, T = 'plaster-stone-wall', TR = 'timber-trim', top = WH - RAIL;
  const body = (a, b, za, zb) => box(0, a, za, WT, b, zb, T, { tT: TR, refTop: WH });
  const P = [];
  if (kind === 'plain') {
    P.push(body(y0, y1, 0, top));
  } else {
    const win = kind === 'window';
    const ya = y0 + (win ? 0.3 : 0.32) * L, yb = y0 + (win ? 0.7 : 0.68) * L;
    const sill = win ? 0.4 : 0, head = win ? 0.78 : DH;
    P.push(body(y0, ya, 0, top), body(yb, y1, 0, top), body(ya, yb, head, top));
    if (win) {
      P.push(body(ya, yb, 0, sill));
      P.push(quad([0.06, ya, head], [0, yb - ya, 0], [0, 0, -(head - sill)], 'lattice-window', 'right', [1, 0, 0], { layer: -1 }));
      P.push(box(-0.02, ya - 0.035, sill - 0.03, WT + 0.02, yb + 0.035, sill, TR, { tT: TR }));
    } else {
      P.push(quad([0.05, ya, DH], [0, yb - ya, 0], [0, 0, -DH], 'doorway-dark', 'right', [1, 0, 0], { layer: -1 }));
      if (kind === 'door') P.push(box(0.04, ya, 0, 0.11, yb, DH - 0.02, 'door-wood', { tT: 'door-wood' }));
      if (kind === 'doorOpen') P.push(box(WT, ya, 0, WT + 0.34, ya + 0.05, DH - 0.02, 'door-wood', { tT: 'door-wood' }));
    }
    P.push(box(-0.015, ya - 0.035, sill, WT + 0.015, ya, head, TR, { tT: TR }));
    P.push(box(-0.015, yb, sill, WT + 0.015, yb + 0.035, head, TR, { tT: TR }));
  }
  P.push(box(-0.02, y0, top, WT + 0.02, y1, WH, TR, { tT: TR }));               // top rail
  return P;
}

// L-shaped corner: one wall along y, one along x (made by mirroring).
const corner = (kind = 'plain', otherKind = 'plain') => [...wallY(kind, 0, 1), ...mirrorList(wallY(otherKind, WT, 1))];

function gableRoof(tile = 'roof-shingle-red', h = 0.45) {
  const ym = 0.5;
  return [
    quad([0, ym, h], [1, 0, 0], [0, -ym, -h], tile, 'top', [0, -h, ym], { shadeA: 0.14 }),   // −y slope
    quad([0, ym, h], [1, 0, 0], [0, ym, -h], tile, 'top', [0, h, ym]),                       // +y slope
    tri([[1, 0, 0], [1, 1, 0], [1, ym, h]], [1, 0, h], [0, 1, 0], [0, 0, -h], 'gable-plaster', 'right', [1, 0, 0]),
    tri([[0, 0, 0], [0, 1, 0], [0, ym, h]], [0, 0, h], [0, 1, 0], [0, 0, -h], 'gable-plaster', 'right', [-1, 0, 0]),
    line([[1, 0, 0], [1, ym, h], [1, 1, 0]], [1, 0, 0]),
    line([[0, 0, 0], [0, ym, h], [0, 1, 0]], [-1, 0, 0]),
  ];
}

function pyramidRoof(tile = 'roof-shingle-red', h = 0.75) {
  const a = [0.5, 0.5, h];
  return [
    quad([0, 0.5, h], [1, 0, 0], [0, 0.5, -h], tile, 'top', [0, h, 0.5]),
    quad([0.5, 0, h], [0, 1, 0], [0.5, 0, -h], tile, 'top', [h, 0, 0.5], { shadeA: 0.16 }),
    quad([0, 0.5, h], [1, 0, 0], [0, -0.5, -h], tile, 'top', [0, -h, 0.5], { shadeA: 0.1 }),
    quad([0.5, 0, h], [0, 1, 0], [-0.5, 0, -h], tile, 'top', [-h, 0, 0.5], { shadeA: 0.1 }),
  ].map((f, i) => {
    const polys = [
      [[0, 1, 0], [1, 1, 0], a], [[1, 0, 0], [1, 1, 0], a], [[0, 0, 0], [1, 0, 0], a], [[0, 0, 0], [0, 1, 0], a],
    ];
    return { ...f, poly: polys[i] };
  });
}

/* ───────────────────────── 90° variants ───────────────────────── */

// Pieces that look identical when turned a quarter-turn get no separate variant.
const ROT_SYMMETRIC = new Set([
  'block-moss', 'block-light', 'block-hollow', 'floor-flagstone', 'floor-plank', 'floor-plank-worn',
  'well', 'pillar-short', 'pillar-tall', 'roof-pyramid', 'roof-pyramid-plum', 'roof-cap', 'stool', 'planter',
]);

/** A copy of a structure turned `turns` × 90° (new id "<id>-r90", name "<name> (90°)"). */
function rotatedVariant(structure, turns = 1) {
  const t = ((turns % 4) + 4) % 4;
  return {
    ...structure,
    id: `${structure.id}-r${t * 90}`,
    name: `${structure.name} (${t * 90}°)`,
    build: () => structure.build().map(p => transformPrim(p, { rot: t, mirror: false })),
  };
}

/** The 90° versions only. */
const STRUCTURES_ROT90 = STRUCTURES.filter(s => !ROT_SYMMETRIC.has(s.id)).map(s => rotatedVariant(s, 1));

/** Library with each structure followed by its 90° version (symmetric pieces appear once). */
const STRUCTURES_WITH_90 = STRUCTURES.flatMap(s => (ROT_SYMMETRIC.has(s.id) ? [s] : [s, rotatedVariant(s, 1)]));


/* ───────────────────────── rendering ───────────────────────── */

function spans(len, off) {
  const out = [];
  let a = 0;
  while (a < len - 1e-6) {
    const ph = (((a + off) % 1) + 1) % 1;
    const seg = Math.min(1 - ph, len - a);
    if (seg > 1e-4) out.push([a, ph, seg]);
    a += Math.max(seg, 1e-4);
  }
  return out;
}

const keyOf = p => {
  if (p.k === 'box') return (p.x0 + p.x1 + p.y0 + p.y1 + p.z0 + p.z1) / 2;
  if (p.k === 'cyl') return p.cx + p.cy + (p.z0 + p.z1) / 2;
  const pts = p.poly || p.pts;
  let s = 0;
  pts.forEach(q => { s += q[0] + q[1] + q[2]; });
  return s / pts.length;
};

function* boxFaces(b) {
  const refTop = b.refTop ?? b.z1;
  const h = b.z1 - b.z0;
  yield { k: 'face', role: 'top', tile: b.tT || b.tile, o: [b.x0, b.y0, b.z1], u: [b.x1 - b.x0, 0, 0], v: [0, b.y1 - b.y0, 0],
    poly: [[b.x0, b.y0, b.z1], [b.x1, b.y0, b.z1], [b.x1, b.y1, b.z1], [b.x0, b.y1, b.z1]] };
  yield { k: 'face', role: 'right', tile: b.tile, o: [b.x1, b.y0, b.z1], u: [0, b.y1 - b.y0, 0], v: [0, 0, -h], v0: refTop - b.z1,
    poly: [[b.x1, b.y0, b.z1], [b.x1, b.y1, b.z1], [b.x1, b.y1, b.z0], [b.x1, b.y0, b.z0]] };
  yield { k: 'face', role: 'left', tile: b.tile, o: [b.x0, b.y1, b.z1], u: [b.x1 - b.x0, 0, 0], v: [0, 0, -h], v0: refTop - b.z1,
    poly: [[b.x0, b.y1, b.z1], [b.x1, b.y1, b.z1], [b.x1, b.y1, b.z0], [b.x0, b.y1, b.z0]] };
}

function drawFace(g, f, T, S, ox, oy) {
  const tile = T(f.tile);
  const tex = faceTexture(tile, f.role);
  const size = tex.width;
  const lu = Math.hypot(...f.u), lv = Math.hypot(...f.v);
  if (lu < 1e-6 || lv < 1e-6) return;
  const uh = f.u.map(c => c / lu), vh = f.v.map(c => c / lv);
  const pu = projVec(uh, S), pv = projVec(vh, S);
  const pts = f.poly.map(p => proj(p, S, ox, oy));
  const path = () => { g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); };

  g.save();
  path(); g.clip();
  g.imageSmoothingEnabled = false;
  for (const [a, fu, su] of spans(lu, 0)) {
    for (const [b, fv, sv] of spans(lv, f.v0 || 0)) {
      const w = [f.o[0] + uh[0] * a + vh[0] * b, f.o[1] + uh[1] * a + vh[1] * b, f.o[2] + uh[2] * a + vh[2] * b];
      const p = proj(w, S, ox, oy);
      g.save();
      g.transform(pu[0] / size, pu[1] / size, pv[0] / size, pv[1] / size, p[0], p[1]);
      g.drawImage(tex, fu * size, fv * size, su * size, sv * size, 0, 0, su * size + 0.6, sv * size + 0.6);
      g.restore();
    }
  }
  if (f.shadeA) { path(); g.fillStyle = `rgba(0,0,0,${f.shadeA})`; g.fill(); }
  g.restore();

  g.save();
  path();
  g.strokeStyle = 'rgba(0,0,0,.38)';
  g.lineWidth = 1;
  g.stroke();
  g.restore();
}

function drawCyl(g, p, T, S, ox, oy) {
  const [cx, cy] = proj([p.cx, p.cy, 0], S, ox, oy);
  const rx = p.r * Math.SQRT2 * S, ry = (p.r * S) / Math.SQRT2;
  const yTop = cy - p.z1 * S, yBot = cy - p.z0 * S;
  const side = g.createPattern(faceTexture(T(p.tile), 'left'), 'repeat');
  const top = g.createPattern(faceTexture(T(p.tT || p.tile), 'top'), 'repeat');
  g.save();
  g.imageSmoothingEnabled = false;
  g.beginPath();
  g.moveTo(cx + rx, yTop); g.lineTo(cx + rx, yBot);
  g.ellipse(cx, yBot, rx, ry, 0, 0, Math.PI, false);
  g.lineTo(cx - rx, yTop); g.closePath();
  g.fillStyle = side; g.fill();
  g.strokeStyle = 'rgba(0,0,0,.38)'; g.lineWidth = 1; g.stroke();
  g.beginPath(); g.ellipse(cx, yTop, rx, ry, 0, 0, Math.PI * 2);
  g.fillStyle = top; g.fill(); g.stroke();
  g.restore();
}

function resolvePrims(structure, { rot = 0, mirror = false } = {}) {
  return structure.build().map(p => transformPrim(p, { rot, mirror }));
}

function primPoints(p) {
  if (p.k === 'box') return [[p.x0, p.y0, p.z0], [p.x1, p.y1, p.z1], [p.x1, p.y0, p.z0], [p.x0, p.y1, p.z1]];
  if (p.k === 'cyl') return [[p.cx - p.r, p.cy - p.r, p.z0], [p.cx + p.r, p.cy + p.r, p.z1]];
  return p.poly || p.pts;
}

function structureBounds(prims, S) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  prims.forEach(p => primPoints(p).forEach(q => {
    const [x, y] = proj(q, S, 0, 0);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }));
  return { minX, maxX, minY, maxY };
}

/**
 * Draw one structure. (x, y) is where the centre of its 1×1 footprint lands
 * on screen, so a row of structures shares one ground line.
 */
function drawStructure(g, structure, tiles, { x = 0, y = 0, S = 40, rot = 0, mirror = false, alpha = 1 } = {}) {
  const idx = tiles instanceof Array ? tileIndex(tiles) : tiles;
  const fallback = { id: '_missing', top: '#ff00ff', bottom: '#aa00aa', split: 50 };
  const T = id => idx[id] || fallback;
  const ox = x, oy = y - 0.5 * S;
  const prims = resolvePrims(structure, { rot, mirror });
  const items = [];
  prims.forEach(p => {
    if (p.k === 'box') for (const f of boxFaces(p)) items.push({ ...f, layer: p.layer, key: keyOf(p), _box: true });
    else items.push({ ...p, key: keyOf(p) });
  });
  // box faces keep their box's sort key so a box's three faces stay together
  items.sort((a, b) => (a.layer - b.layer) || (a.key - b.key));

  g.save();
  g.globalAlpha = alpha;
  items.forEach(it => {
    if (it.n && dot(it.n, VIEW) <= 1e-9) return;
    if (it.k === 'face') drawFace(g, it, T, S, ox, oy);
    else if (it.k === 'cyl') drawCyl(g, it, T, S, ox, oy);
    else if (it.k === 'line') {
      g.beginPath();
      it.pts.map(p => proj(p, S, ox, oy)).forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
      g.strokeStyle = it.color; g.lineWidth = it.w; g.lineJoin = 'round'; g.stroke();
    }
  });
  g.restore();
}

/** Contact sheet of structures (used by the demo page and for palette art). */
function drawStructureSheet(g, structures, tiles, { S = 36, cols = 6, cellW = 130, cellH = 128, rot = 0, mirror = false, labels = true, bg = '#0d0d10' } = {}) {
  const rows = Math.ceil(structures.length / cols);
  g.fillStyle = bg;
  g.fillRect(0, 0, cols * cellW, rows * cellH);
  structures.forEach((s, i) => {
    const cx = (i % cols) * cellW + cellW / 2;
    const cy = Math.floor(i / cols) * cellH + cellH * 0.64;
    drawStructure(g, s, tiles, { x: cx, y: cy, S, rot, mirror });
    if (labels) {
      g.fillStyle = '#a0a0c0';
      g.font = '9px Inter, system-ui, sans-serif';
      g.textAlign = 'center';
      g.fillText(s.name, cx, Math.floor(i / cols) * cellH + cellH - 6);
    }
  });
  return { width: cols * cellW, height: rows * cellH };
}

const structurePreviewCache = new Map();
/** Small data-URL thumbnail for a structure palette button. */
function structurePreviewURL(structure, tiles = DEFAULT_TILES, { rot = 0, mirror = false, w = 88, h = 72, S = 24 } = {}) {
  const key = `${structure.id}|${rot}|${mirror}|${w}x${h}|${S}`;
  if (structurePreviewCache.has(key)) return structurePreviewCache.get(key);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  drawStructure(c.getContext('2d'), structure, tiles, { x: w / 2, y: h * 0.7, S, rot, mirror });
  const url = c.toDataURL();
  structurePreviewCache.set(key, url);
  return url;
}

/* ── demo ── */
const canvas = document.getElementById('sheet');
const cols = 6, cellW = 150, cellH = 140;
let rot = 0, mirror = false, S = 38, with90 = true;
function draw() {
  const list = with90 ? STRUCTURES_WITH_90 : STRUCTURES;
  const rows = Math.ceil(list.length / cols);
  canvas.width = cols * cellW;
  canvas.height = rows * cellH;
  drawStructureSheet(canvas.getContext('2d'), list, DEFAULT_TILES, { S, cols, cellW, cellH, rot, mirror });
  document.getElementById('state').textContent = list.length + ' pieces \u00b7 rot ' + (rot * 90) + '\u00b0 \u00b7 ' + (mirror ? 'mirrored' : 'no mirror');
}
document.getElementById('rotCW').onclick = () => { rot = (rot + 1) % 4; draw(); };
document.getElementById('rotCCW').onclick = () => { rot = (rot + 3) % 4; draw(); };
document.getElementById('mirror').onclick = e => { mirror = !mirror; e.currentTarget.classList.toggle('active', mirror); draw(); };
document.getElementById('with90').onchange = e => { with90 = e.target.checked; draw(); };
document.getElementById('scale').oninput = e => { S = +e.target.value; document.getElementById('scaleV').textContent = S; draw(); };
draw();

</script>
