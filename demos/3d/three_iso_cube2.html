<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Isometric Dither</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0d0d10; 
            font-family: 'Space Mono', monospace;
            color: #4a4a60;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #111115;
            border: 1px solid #1f1f28;
            padding: 15px;
            width: 260px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
        input[type="range"] { flex: 1; margin: 0 10px; accent-color: #3ecfb2; background: #191920; }
        input[type="color"] { background: none; border: 1px solid #2a2a38; cursor: pointer; height: 24px; width: 40px; padding: 0; }
        select { background: #0f0f14; color: #7a7a9a; border: 1px solid #2a2a38; padding: 4px; font-family: 'Space Mono'; font-size: 10px; text-transform: uppercase; }
        
        .title { color: #7a7a9a; font-size: 12px; text-transform: uppercase; letter-spacing: 0.2em; border-bottom: 1px solid #1f1f28; padding-bottom: 8px; margin-bottom: 4px; }
        .hint { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #3ecfb2; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="title">Geometry</div>
        <div class="row">Top <input type="color" id="colA" value="#3ecfb2"></div>
        <div class="row">Bot <input type="color" id="colB" value="#c94b6e"></div>
        <div class="row">Split <input type="range" id="split" min="-50" max="50" value="0"></div>
        
        <div class="title" style="margin-top: 10px;">Dither Pattern</div>
        <div class="row">Mode 
            <select id="dMode">
                <option value="0">Off</option>
                <option value="1">Noise</option>
                <option value="2">H-Lines</option>
                <option value="3">V-Lines</option>
                <option value="4" selected>Crosshatch</option>
            </select>
        </div>
        <div class="row">Spacing <input type="range" id="dSpace" min="2" max="16" value="6"></div>
        <div class="row">Thickness <input type="range" id="dThick" min="1" max="6" value="1" step="0.5"></div>
        <div class="row">Bright <input type="range" id="dBright" min="-100" max="100" value="-40"></div>
        <div class="row">Blend <input type="range" id="dAlpha" min="5" max="100" value="70"></div>
    </div>

    <div class="hint">Left Click + Drag to Rotate • Scroll to Zoom</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#0d0d10', 0.05);

        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 10;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2, frustumSize * aspect / 2, 
            frustumSize / 2, frustumSize / -2, 
            1, 1000
        );
        camera.position.set(10, 10, 10);
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 2);
        scene.add(directionalLight);

        const grid = new THREE.GridHelper(20, 20, 0x3ecfb2, 0x1f1f28);
        grid.position.y = -1.0;
        scene.add(grid);

        // 3. SHADER UNIFORMS (Bridging UI sliders to the GPU)
        const customUniforms = {
            colorA: { value: new THREE.Color('#3ecfb2') },
            colorB: { value: new THREE.Color('#c94b6e') },
            splitY: { value: 0.0 },
            
            // Dither specific uniforms mapped from original canvas logic
            dMode: { value: 4 }, // 0:Off, 1:Noise, 2:H, 3:V, 4:Cross
            dSpace: { value: 6.0 },
            dThick: { value: 1.0 },
            dBright: { value: -0.4 }, // -1.0 to 1.0
            dAlpha: { value: 0.7 }    // 0.0 to 1.0
        };

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.1 });

        // 4. THE CUSTOM SHADER
        material.onBeforeCompile = (shader) => {
            // Attach uniforms
            shader.uniforms.colorA = customUniforms.colorA;
            shader.uniforms.colorB = customUniforms.colorB;
            shader.uniforms.splitY = customUniforms.splitY;
            shader.uniforms.dMode = customUniforms.dMode;
            shader.uniforms.dSpace = customUniforms.dSpace;
            shader.uniforms.dThick = customUniforms.dThick;
            shader.uniforms.dBright = customUniforms.dBright;
            shader.uniforms.dAlpha = customUniforms.dAlpha;

            // Pass local position and UV data from vertex to fragment
            shader.vertexShader = `
                varying float vLocalY;
                varying vec2 myUv;
                ${shader.vertexShader}
            `.replace(
                `#include <begin_vertex>`,
                `#include <begin_vertex>
                 vLocalY = position.y;
                 myUv = uv;` // Grab object's built-in UV coordinates
            );

            shader.fragmentShader = `
                uniform vec3 colorA;
                uniform vec3 colorB;
                uniform float splitY;
                
                uniform int dMode;
                uniform float dSpace;
                uniform float dThick;
                uniform float dBright;
                uniform float dAlpha;

                varying float vLocalY;
                varying vec2 myUv;
                ${shader.fragmentShader}
            `;

            // Step A: Replace the base color with the A/B Split logic
            shader.fragmentShader = shader.fragmentShader.replace(
                `vec4 diffuseColor = vec4( diffuse, opacity );`,
                `
                vec3 splitBase = vLocalY > splitY ? colorA : colorB;
                vec4 diffuseColor = vec4( splitBase, opacity );
                `
            );

            // Step B: Inject Dithering at the END of the lighting calculation
            shader.fragmentShader = shader.fragmentShader.replace(
                `#include <dithering_fragment>`,
                `#include <dithering_fragment>

                if (dMode > 0) {
                    bool isDither = false;
                    
                    // Scale the 0-to-1 UV coordinates based on UI spacing
                    vec2 scaledUv = myUv * (100.0 / dSpace);
                    float lineThreshold = dThick / dSpace;

                    if (dMode == 1) { 
                        // Pixelated Noise (using floor makes it blocky instead of smooth)
                        vec2 gridUv = floor(scaledUv);
                        float noise = fract(sin(dot(gridUv, vec2(12.9898, 78.233))) * 43758.5453);
                        isDither = noise > 0.5;
                    } else if (dMode == 2) { 
                        // H-Lines
                        isDither = fract(scaledUv.y) < lineThreshold;
                    } else if (dMode == 3) { 
                        // V-Lines
                        isDither = fract(scaledUv.x) < lineThreshold;
                    } else if (dMode == 4) { 
                        // Crosshatch
                        isDither = (fract(scaledUv.y) < lineThreshold) || (fract(scaledUv.x) < lineThreshold);
                    }

                    if (isDither) {
                        // Decide if the line is tinted towards white or black
                        vec3 targetCol = dBright > 0.0 ? vec3(1.0) : vec3(0.0);
                        
                        // Shift the fully lit pixel color towards the target
                        vec3 shifted = mix(gl_FragColor.rgb, targetCol, abs(dBright));
                        
                        // Blend the final line over the object based on UI alpha
                        gl_FragColor.rgb = mix(gl_FragColor.rgb, shifted, dAlpha);
                    }
                }
                `
            );
        };

        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // 5. EDGES OUTLINE
        const edgesGeom = new THREE.EdgesGeometry(geometry);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 });
        const cubeEdges = new THREE.LineSegments(edgesGeom, edgesMat);
        cube.add(cubeEdges);

        // 6. UI EVENT LISTENERS
        document.getElementById('colA').addEventListener('input', e => customUniforms.colorA.value.set(e.target.value));
        document.getElementById('colB').addEventListener('input', e => customUniforms.colorB.value.set(e.target.value));
        document.getElementById('split').addEventListener('input', e => customUniforms.splitY.value = e.target.value / 50);
        
        document.getElementById('dMode').addEventListener('change', e => customUniforms.dMode.value = parseInt(e.target.value));
        document.getElementById('dSpace').addEventListener('input', e => customUniforms.dSpace.value = parseFloat(e.target.value));
        document.getElementById('dThick').addEventListener('input', e => customUniforms.dThick.value = parseFloat(e.target.value));
        // Normalize -100 to +100 range into -1.0 to 1.0 for the shader
        document.getElementById('dBright').addEventListener('input', e => customUniforms.dBright.value = parseFloat(e.target.value) / 100);
        // Normalize 0 to 100 range into 0.0 to 1.0 for the shader
        document.getElementById('dAlpha').addEventListener('input', e => customUniforms.dAlpha.value = parseFloat(e.target.value) / 100);

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

    </script>
</body>
</html>
