<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420">

  <defs>
    <symbol id="cube" viewBox="0 0 120 120">
      <polygon points="60,10 110,40 60,70 10,40" fill="#cccccc"/>
      <polygon points="10,40 60,70 60,110 10,80" fill="#aaaaaa"/>
      <polygon points="110,40 60,70 60,110 110,80" fill="#888888"/>
    </symbol>

    <symbol id="rect_prism" viewBox="0 0 140 120">
      <polygon points="50,10 130,40 80,70 0,40" fill="#d0d0d0"/>
      <polygon points="0,40 80,70 80,110 0,80" fill="#b0b0b0"/>
      <polygon points="130,40 80,70 80,110 130,80" fill="#909090"/>
    </symbol>

    <symbol id="sphere" viewBox="0 0 120 120">
      <defs>
        <radialGradient id="sphereGrad">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#8888aa"/>
        </radialGradient>
      </defs>
      <circle cx="60" cy="60" r="40" fill="url(#sphereGrad)" />
    </symbol>

    <symbol id="ramp" viewBox="0 0 140 120">
      <polygon points="20,60 100,60 100,100 20,100" fill="#999"/>
      <polygon points="20,60 100,60 120,40 40,40" fill="#ccc"/>
      <polygon points="100,60 120,40 120,80 100,100" fill="#777"/>
    </symbol>

    <symbol id="arc" viewBox="0 0 140 120">
      <path d="M20 80 A40 40 0 0 1 100 80 L100 100 A40 40 0 0 0 20 100 Z" fill="#aaa"/>
      <path d="M20 80 A40 40 0 0 1 100 80 L120 60 A60 60 0 0 0 0 60 Z" fill="#ccc"/>
    </symbol>

    <symbol id="bridge" viewBox="0 0 160 120">
      <polygon points="20,70 140,70 120,90 0,90" fill="#999"/>
      <path d="M30 70 Q80 20 130 70" stroke="#666" stroke-width="6" fill="none"/>
    </symbol>

    <symbol id="column" viewBox="0 0 120 140">
      <ellipse cx="60" cy="20" rx="30" ry="10" fill="#ccc"/>
      <rect x="30" y="20" width="60" height="80" fill="#aaa"/>
      <ellipse cx="60" cy="100" rx="30" ry="10" fill="#888"/>
    </symbol>

    <symbol id="house" viewBox="0 0 140 140">
      <polygon points="70,20 120,50 70,80 20,50" fill="#cc6666"/>
      <polygon points="20,50 70,80 70,120 20,90" fill="#bbbbbb"/>
      <polygon points="120,50 70,80 70,120 120,90" fill="#999999"/>
    </symbol>

    <symbol id="cylinder" viewBox="0 0 120 140">
      <ellipse cx="60" cy="30" rx="30" ry="10" fill="#cccccc"/>
      <rect x="30" y="30" width="60" height="70" fill="#aaaaaa"/>
      <ellipse cx="60" cy="100" rx="30" ry="10" fill="#888888"/>
    </symbol>
  </defs>

  <!-- Preview grid -->
  <use href="#cube" x="10" y="10" width="100" height="100"/>
  <use href="#rect_prism" x="120" y="10" width="100" height="100"/>
  <use href="#sphere" x="230" y="10" width="100" height="100"/>
  <use href="#ramp" x="340" y="10" width="100" height="100"/>

  <use href="#arc" x="10" y="140" width="100" height="100"/>
  <use href="#bridge" x="120" y="140" width="100" height="100"/>
  <use href="#column" x="230" y="140" width="100" height="100"/>
  <use href="#house" x="340" y="140" width="100" height="100"/>

  <!-- Bigger cylinder highlight -->
  <use href="#cylinder" x="180" y="260" width="140" height="140"/>

</svg>
